<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <title>Ngoc Dung &amp; Dang Khoa | Wedding Invitation</title>

    <meta
      name="description"
      content="Ngoc Dung and Dang Khoa to celebrate their wedding on June 14, 2027, at The Garden House, Ho Chi Minh City."
    />

    <meta name="theme-color" content="#eae5df" />
    <meta name="color-scheme" content="light" />

    <!-- Keep the invitation out of search results.
         This does not make the website private. -->
    <meta name="robots" content="noindex, nofollow" />

    <!-- Replace with your actual published URL. -->
    <link rel="canonical" href="https://khoa-dung.vercel.app/" />

    <!-- Link previews: Facebook, messaging apps, etc. -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:site_name" content="Dung &amp; Khoa" />
    <meta property="og:title" content="Dung &amp; Khoa — You're Invited" />
    <meta
      property="og:description"
      content="June 14, 2027 · The Garden House, Ho Chi Minh City. We cannot wait to celebrate with you."
    />
    <meta property="og:url" content="https://your-domain.com/" />
    <meta
      property="og:image"
      content="https://your-domain.com/images/wedding-preview.jpg"
    />
    <meta
      property="og:image:alt"
      content="Dung and Khoa's wedding invitation"
    />

    <!-- X / Twitter link preview -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Dung &amp; Khoa — You're Invited" />
    <meta
      name="twitter:description"
      content="June 14, 2027 · The Garden House, Ho Chi Minh City."
    />
    <meta
      name="twitter:image"
      content="https://your-domain.com/images/wedding-preview.jpg"
    />
    <meta
      name="twitter:image:alt"
      content="Dung and Khoa's wedding invitation"
    />

    <!-- Use the existing wax seal as the browser icon. -->
    <link rel="icon" type="image/png" href="/images/wax-seal.png" />
  </head>

  <body>
    <div id="app"></div>

    <noscript>
      Please enable JavaScript to open our wedding invitation.
    </noscript>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
